# 비동기 알림 워커: Kafka 토픽(notifications)을 소비해 실제 처리를 뒤에서 담당.
# API(프로듀서)와 분리돼 독립적으로 스케일 가능. 같은 이미지를 MODE=worker로 구동.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notiflex-worker
  namespace: notiflex
  labels:
    app: notiflex-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notiflex-worker
  template:
    metadata:
      labels:
        app: notiflex-worker
    spec:
      # 애플리케이션 워크로드 → app-pool (taint 허용)
      nodeSelector:
        role: app
      tolerations:
        - key: dedicated
          operator: Equal
          value: app
          effect: NoSchedule
      containers:
        - name: notiflex-worker
          # notiflex API와 동일 이미지 (MODE=worker로 컨슈머 구동). CI는 rollout.yaml만
          # 자동 갱신하므로, 앱 변경 시 이 태그는 수동으로 맞춘다(워크플로 스코프 제약).
          image: asia-northeast3-docker.pkg.dev/hayley-gitaiops-project/notiflex/api:sha-5a73d87
          env:
            - name: MODE
              value: worker
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_ADDR
              value: kafka.notiflex.svc.cluster.local:9092
            - name: VALKEY_ADDR
              value: valkey-primary.notiflex.svc.cluster.local:6379
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey
                  key: valkey-password
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
