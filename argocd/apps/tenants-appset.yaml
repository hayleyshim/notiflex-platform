# 고객(테넌트) 온보딩 자동화 ApplicationSet.
# tenants/customers/ 아래 각 디렉터리를 스캔해 고객마다 Application을 생성한다.
# 고객 추가 = tenants/customers/<이름>/kustomization.yaml 디렉터리 하나 추가 → 자동 편입.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenants
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/hayleyshim/notiflex-platform.git
        revision: main
        directories:
          - path: tenants/customers/*
  template:
    metadata:
      # 디렉터리 이름(고객명)으로 Application·네임스페이스를 만든다.
      name: 'tenant-{{.path.basename}}'
      # 오프보딩(디렉터리 삭제) 시 워크로드까지 cascade 삭제되도록 finalizer 부여.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: tenants
      source:
        repoURL: https://github.com/hayleyshim/notiflex-platform.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'tenant-{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
