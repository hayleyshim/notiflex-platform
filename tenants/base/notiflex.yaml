# 테넌트 전용 notiflex API 인스턴스. 같은 네임스페이스의 Valkey에 접속한다.
# (프로덕션 k8s/smb와 달리 CSI 시크릿 없이 무인증 Valkey를 쓰는 PoC 구성)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notiflex-api
  labels:
    app: notiflex-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notiflex-api
  template:
    metadata:
      labels:
        app: notiflex-api
    spec:
      containers:
        - name: notiflex-api
          image: asia-northeast3-docker.pkg.dev/hayley-gitaiops-project/notiflex/api:sha-865dad5
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # 같은 테넌트 네임스페이스의 Valkey (무인증 → 비밀번호 미설정)
            - name: VALKEY_ADDR
              value: valkey:6379
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notiflex-api
  labels:
    app: notiflex-api
spec:
  selector:
    app: notiflex-api
  ports:
    - port: 80
      targetPort: 8080
