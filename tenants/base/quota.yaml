# 테넌트별 자원 상한: 한 고객이 클러스터 자원을 독점하지 못하게 한다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
spec:
  hard:
    requests.cpu: "250m"
    requests.memory: 256Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    pods: "10"
---
# 컨테이너 기본 requests/limits (미지정 파드에도 상한 강제)
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-limits
spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 128Mi
      defaultRequest:
        cpu: 10m
        memory: 32Mi
