# 고객: Acme (요금제: enterprise)
# 공통 base를 참조하고, 이 고객만의 설정(레플리카·쿼터)을 패치로 덮어쓴다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# 셀렉터는 건드리지 않고(메타데이터/파드 라벨에만) 테넌트·티어 라벨 부여
labels:
  - pairs:
      tenant: acme
      tier: enterprise
    includeSelectors: false
patches:
  # enterprise: notiflex 2 레플리카
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: notiflex-api
      spec:
        replicas: 2
  # enterprise: 자원 상한 상향
  - patch: |-
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: tenant-quota
      spec:
        hard:
          requests.cpu: "500m"
          requests.memory: 512Mi
          limits.cpu: "2"
          limits.memory: 2Gi
          pods: "20"
